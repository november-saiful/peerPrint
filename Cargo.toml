[package]
name = "peerprint"
version = "0.1.2"
edition = "2021"
description = "Share USB printers over Wi-Fi"
license = "MIT"
rust-version = "1.85"

[[bin]]
name = "peerprint"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.37", features = ["image"] }
tray-icon = "0.26"
raw-window-handle = "0.6"

tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "fs", "macros", "signal", "process"] }
bytes = "1"
futures-util = "0.3"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
mdns-sd = "0.21"
spake2 = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
postcard = { version = "1.1", features = ["alloc"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
base64 = "0.22"

windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Printing",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Services",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
